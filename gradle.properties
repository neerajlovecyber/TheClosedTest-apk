# Gradle JVM Memory Configuration
# Optimized for GitHub Actions CI/CD (7GB RAM available)

# Maximize heap for faster builds: 5GB (leave 2GB for system)
# Metaspace: 1GB (prevent OutOfMemoryError during compilation)
org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable Gradle daemon for faster builds
org.gradle.daemon=true

# Enable parallel execution (faster builds in CI)
org.gradle.parallel=true
org.gradle.workers.max=4

# Enable configuration cache (Gradle 6.5+)
org.gradle.configureondemand=true
org.gradle.caching=true

# Android-specific optimizations
android.useAndroidX=true
android.enableJetifier=true

# Disable unnecessary tasks for faster CI builds
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
