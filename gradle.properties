# Gradle JVM Memory Configuration
# Optimized for CI/CD and local builds

# Heap: 4GB, Metaspace: 3GB (maximum to prevent OutOfMemoryError)
# Further increased Metaspace for class metadata
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=3g -XX:MetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable Gradle daemon for faster builds
org.gradle.daemon=true

# Enable parallel execution with reduced workers to save memory
org.gradle.parallel=true
org.gradle.workers.max=2

# Enable configuration cache (Gradle 6.5+)
org.gradle.configureondemand=true
org.gradle.caching=true

# Android-specific optimizations
android.useAndroidX=true
android.enableJetifier=true

# Disable unnecessary tasks for faster CI builds
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
# Disable lint checks completely to avoid OutOfMemoryError
android.lint.checkReleaseBuilds=false
android.lint.abortOnError=false
android.lint.ignoreWarnings=true
