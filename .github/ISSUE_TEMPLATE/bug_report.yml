name: 🐛 Bug Report
description: Create a report to help us fix a bug or unexpected behavior
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and resolve it quickly.

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of the project is affected?
      options:
        - Mobile App (React Native / Expo)
        - Backend API (Hono / Bun / Drizzle)
        - Push Notifications
        - Image Upload / Cloudflare R2
        - Authentication (Clerk)
        - Documentation / Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the issue in detail...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Tap on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
      placeholder: A clear description of the expected behavior...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Device & Environment
      description: Device details, OS version, or browser (if applicable).
      placeholder: |
        - Device: [e.g. Pixel 8, Samsung Galaxy S23]
        - OS: [e.g. Android 14, iOS 17]
        - App Version / Commit: [e.g. v3.0.0]
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Error Logs
      description: Attach screenshots, screen recordings, or terminal logs if relevant.
      placeholder: Drag & drop images or paste error stack traces here...
    validations:
      required: false
