name: Cloudflare OTA Update

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "backend/**"
      - ".github/**"
      - ".gitignore"
      - ".eslintrc*"
      - "prettier*"
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        description: "Deployment channel"
        default: "production"
        options:
          - production
          - preview

jobs:
  ota-update:
    name: Publish OTA Update
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 🏗 Checkout repository with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 🏗 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 📦 Install dependencies
        run: bun install

      - name: 🚀 Publish OTA Update to Cloudflare
        env:
          OTA_SERVER: "https://expo-ota-updates.neerajsec.workers.dev"
          OTA_API_KEY: ${{ secrets.OTA_API_KEY || vars.OTA_API_KEY }}
          APP_VARIANT: production
        run: |
          if [ -z "$OTA_API_KEY" ]; then
            echo "::error::Missing OTA_API_KEY! Please configure OTA_API_KEY in GitHub Secrets or Variables."
            exit 1
          fi
          CHANNEL="${{ github.event.inputs.channel || 'production' }}"
          echo "Publishing OTA update to channel: $CHANNEL..."
          bun run cloudflare-expo-ota-updates/apps/easc/index.ts update --channel "$CHANNEL" --dangerously-ignore-fingerprint-check
