name: Automated Tests & Code Quality

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [master, main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"

jobs:
  backend-tests:
    name: Backend Integration Tests (48 Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: bun install --frozen-lockfile

      - name: Run Backend Test Suite (PGlite In-Memory DB)
        working-directory: ./backend
        env:
          NODE_ENV: test
        run: bun test

  code-quality:
    name: Lint & TypeCheck (Oxlint & TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Root Dependencies
        run: bun install --frozen-lockfile

      - name: TypeCheck Mobile App
        run: bunx tsc --noEmit

      - name: Oxlint & Oxfmt Check
        run: bun run check
