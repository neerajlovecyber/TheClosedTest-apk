name: React Native CI/CD

on:
  workflow_dispatch:
    inputs:
      buildType:
        type: choice
        description: "Build type to run"
        default: "all"
        options:
          - dev
          - prod
          - all

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  check-skip:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Skip CI check
        run: echo "Proceeding with workflow"

  build-and-release:
    needs: check-skip
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: 🔑 Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::Missing EXPO_TOKEN secret! Please configure EXPO_TOKEN in your GitHub repository secrets."
            exit 1
          fi

      - name: 🏗 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🏗 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 📦 Setup bun cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 📦 Install dependencies
        run: bun install

      - name: 📱 Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: bun
          eas-cache: true

      - name: 📱 Build Development APK (EAS Cloud)
        if: github.event.inputs.buildType == 'all' || github.event.inputs.buildType == 'dev'
        run: |
          eas build --platform android --profile development --non-interactive --wait --output=./app-dev.apk
        env:
          NODE_ENV: development

      - name: 📱 Build Production AAB (EAS Cloud)
        if: github.event.inputs.buildType == 'all' || github.event.inputs.buildType == 'prod'
        run: |
          eas build --platform android --profile production --non-interactive --wait --output=./app-prod.aab
        env:
          NODE_ENV: production

      - name: 🏷️ Generate build information
        id: build-info
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BUILD_NUMBER=$(date +%Y%m%d%H%M)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          # Generate changelog from commit messages since last tag
          if git describe --tags --abbrev=0 > /dev/null 2>&1; then
            LAST_TAG=$(git describe --tags --abbrev=0)
            git log $LAST_TAG..HEAD --pretty=format:"- %s" > changelog.md
          else
            git log --pretty=format:"- %s" -n 10 > changelog.md
          fi

      - name: 📝 Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          name: "Release v${{ steps.build-info.outputs.version }}-${{ steps.build-info.outputs.build_number }}"
          tag_name: "v${{ steps.build-info.outputs.version }}-${{ steps.build-info.outputs.build_number }}"
          files: |
            ./app-dev.apk
            ./app-prod.aab
          body_path: changelog.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Upload build artifacts to GitHub
        uses: actions/upload-artifact@v7
        with:
          name: app-builds
          path: |
            ./app-dev.apk
            ./app-prod.aab
          if-no-files-found: warn
          retention-days: 7
